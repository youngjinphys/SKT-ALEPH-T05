name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install deterministic Korean Canvas font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Show browser version
        run: |
          (google-chrome-stable --version || google-chrome --version || chromium --version || chromium-browser --version)
          fc-match -s :lang=ko | head -n 3
      - name: Run full verification
        run: npm run check
